services:
  frontend:
    build: .
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.launchbase.rule=Host(`launchbase.jewellcore.com`)
      - traefik.http.routers.launchbase.entrypoints=http
      - traefik.http.services.launchbase.loadbalancer.server.port=80
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./server
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.launchbase-api.rule=Host(`launchbase.jewellcore.com`) && PathPrefix(`/api`)
      - traefik.http.routers.launchbase-api.entrypoints=http
      - traefik.http.services.launchbase-api.loadbalancer.server.port=5000
    environment:
      - COOLIFY_BASE_URL=${COOLIFY_BASE_URL}
      - COOLIFY_API_TOKEN=${COOLIFY_API_TOKEN}
      - CF_API_TOKEN=${CF_API_TOKEN}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - UNRAID_HOST=${UNRAID_HOST}
      - UNRAID_PORT=${UNRAID_PORT}
      - UNRAID_USER=${UNRAID_USER}
      - UNRAID_PASSWORD=${UNRAID_PASSWORD}
      - SYNC_SECRET=${SYNC_SECRET}
    volumes:
      - launchbase-data:/app/data
    restart: unless-stopped

volumes:
  launchbase-data:

networks:
  coolify:
    external: true
